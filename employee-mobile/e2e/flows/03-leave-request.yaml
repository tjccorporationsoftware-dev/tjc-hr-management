# พนักงานยื่นใบลา
#
# ครึ่งแรกของ critical path ข้อ 1 (ยื่น → อนุมัติ → แจ้งเตือน)
# ครึ่งหลังอยู่ใน 06-approval.yaml ซึ่งใช้บัญชีหัวหน้า
appId: ${APP_ID}
name: ยื่นใบลา
tags:
  - critical
  - requests
---
- runFlow:
    file: ../subflows/sign-in.yaml

- tapOn: 'คำขอ'
- assertVisible: 'คำขอของฉัน'

- tapOn: 'ยื่นคำขอใหม่'
- assertVisible: 'ยื่นคำขอ'

# บันทึกเป็นฉบับร่างก่อน — ไม่ส่งอนุมัติจริงใน E2E เพื่อไม่ให้ใบค้างในคิว
# ของหัวหน้าตัวจริงทุกครั้งที่ CI รัน
- assertVisible: 'บันทึกฉบับร่าง'

# ฟอร์มต้องกันการส่งข้อมูลว่าง ไม่ใช่ปล่อยผ่านไปให้ backend ปฏิเสธ
- tapOn: 'บันทึกฉบับร่าง'
- extendedWaitUntil:
    visible:
      text: 'กรุณากรอก|บันทึกฉบับร่างเรียบร้อย'
    timeout: 10000
