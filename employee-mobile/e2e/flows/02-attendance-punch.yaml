# ลงเวลาเข้างาน
#
# ตรวจว่าผู้ใช้กดลงเวลาแล้วระบบตอบกลับ ไม่ใช่ค้างอยู่ที่ปุ่ม — จอนี้เป็น
# ฟังก์ชันที่พนักงานทุกคนใช้ทุกวัน ถ้าพังคือทั้งบริษัทลงเวลาไม่ได้
#
# ไม่ยืนยันว่า "ลงเวลาสำเร็จ" เสมอไป เพราะผลขึ้นกับ geofence และรอบเวลาจริง
# ของ emulator — สิ่งที่ยืนยันได้คือแอปตอบสนองและไม่ค้าง
appId: ${APP_ID}
name: ลงเวลาเข้างาน
tags:
  - critical
  - attendance
---
- runFlow:
    file: ../subflows/sign-in.yaml

- tapOn: 'ลงเวลา'
- assertVisible:
    id: 'punch-primary-action'

- tapOn:
    id: 'punch-primary-action'

# หลังกดต้องเกิดอย่างใดอย่างหนึ่ง: ขึ้นกล่องยืนยัน / บันทึกสำเร็จ /
# บอกเหตุผลที่ลงเวลาไม่ได้ — ห้ามเงียบ
- extendedWaitUntil:
    visible:
      text: 'ยืนยันการลงเวลา|ลงเวลาเรียบร้อยแล้ว|อยู่นอกพื้นที่|ยังไม่ถึงเวลา|กำลังบันทึก'
    timeout: 15000
